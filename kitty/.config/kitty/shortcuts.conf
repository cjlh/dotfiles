# NOTE
# kitty_mod is ctrl+shift by default on all platforms

# Override built-in aliases to take cwd from oldest active foreground process
action_alias new_window_with_cwd    launch --cwd=oldest
action_alias new_tab_with_cwd       launch --type=tab --cwd=oldest
action_alias new_os_window_with_cwd launch --type=os-window --cwd=oldest

enabled_layouts splits,stack

# -- i3-like window controls

# Auto-position split based on layout
# map cmd+enter launch --location=split --cwd=oldest
# Manually choose split direction
map cmd+shift+enter launch --location=hsplit --cwd=oldest
map cmd+enter       launch --location=vsplit --cwd=oldest
# map cmd+enter       launch --location=hsplit --cwd=oldest
# map cmd+shift+enter launch --location=vsplit --cwd=oldest

# Rotate 90 degrees - allow swapping horizontal/vertical
map cmd+shift+L layout_action rotate 90

# Move focus
map cmd+] nth_window -1
map cmd+shift+left  neighboring_window left
map cmd+shift+right neighboring_window right
map cmd+shift+up    neighboring_window up
map cmd+shift+down  neighboring_window down

# Move windows
map alt+shift+left  move_window left
map alt+shift+right move_window right
map alt+shift+up    move_window up
map alt+shift+down  move_window down

# Focus on current window
map alt+f toggle_layout stack

# Dock the current window on the left and open a new window in a stack on the right,
# with a custom bar listing the stacked windows (requires kitty >= 0.50.0).
# See configured watcher.
map cmd+shift+d kitten dock_window.py

# -- Tab management

# To rename use default shortcut ctrl+alt+shift+t

# Uncomment below if using tmux
# remove default shortcuts that clash with custom tmux shortcuts
# map ctrl+shift+left no_op
# map ctrl+shift+right no_op

# Use left+right for tab movement
map ctrl+shift+, no_op
map ctrl+shift+. no_op
map ctrl+shift+left move_tab_backward
map ctrl+shift+right move_tab_forward

# Use alt instead of ctrl for cycling tabs
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map alt+tab next_tab
map alt+shift+tab previous_tab

# Use current working directory for new tabs
map kitty_mod+t new_tab_with_cwd
map cmd+t new_tab_with_cwd

# Use cwd for new windows
map kitty_mod+n new_os_window_with_cwd
map cmd+n new_os_window_with_cwd
map cmd+shift+n new_window_with_cwd

# -- Misc

map kitty_mod+r load_config_file
