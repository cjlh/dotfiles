# Per-machine tab bar settings.
# Status items appear at the right of the tab bar in the order listed.
#
# Copy to tab_bar.toml and reload kitty's config after editing.

[tabs]
# Show a marker for each stacked window, highlighting the active one.
#
# Examples (inactive, active, separator):
#   Small squares:   "▫", "▪", ""
#   Medium squares:  "◻", "◼", ""
#   Rounded squares: "▢", "■", " "
#   Circles:         "○", "●", " "
#   Bullets:         "◦", "•", ""
#   Custom text:     "<>", "[active]", " | "
inactive-stacked-window-indicator = "▫"
active-stacked-window-indicator = "▪"
stacked-window-indicator-separator = ""

# Highlight tabs when a program needs input or fails. Use "#rrggbb" or a kitty
# colour name. Inactive tabs use dimmer colours. Completed programs and bells
# use the theme's active_border_color.
blocked-tab-color = "#de7500"
error-tab-color = "#c90a0a"

# Each [[provider]] needs a unique name containing letters, digits, "-" or "_".
# The built-in "disk" provider shows available space and takes no other keys.
#
# Command providers accept:
#
#   command   Required program and arguments; prints JSON to stdout.
#             Runs in this config directory, in the background, every interval.
#             "kitty" resolves to the running executable. Failed runs keep
#             the last successful result.
#   format    How the data is shown after the icon:
#             "text" (default)  {"text": "12 EUR"}
#             "usage"           {"session": {"percent": 27.0, "resets_at": 1794595800},
#                                "weekly": {"percent": 6.0, "resets_at": null}}
#                               Displays "27/6" (session/weekly). Weekly usage
#                               appears once it reaches weekly_threshold.
#                               resets_at is a Unix timestamp, or null if unknown.
#                               Usage is treated as zero after that time.
#             JSON null hides the item in either format.
#   icon      Shown before the data, default none.
#   interval  Seconds between runs of command, default 180.
#   timeout   Seconds before a run of command is killed, default 60.
#   weekly_threshold  See the "usage" format, default 0.

[[provider]]
name = "disk"

[[provider]]
name = "codex"
icon = "⌬"
command = ["kitty", "+launch", "agent_usage.py", "codex"]
format = "usage"

[[provider]]
name = "claude"
icon = "✻"
command = ["kitty", "+launch", "agent_usage.py", "claude"]
format = "usage"
