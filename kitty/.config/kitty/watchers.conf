# Python modules that kitty loads for every window and calls on window events.
# Relative paths are resolved against the config directory.
# See: https://sw.kovidgoyal.net/kitty/launch/#watchers

# Dock the current window on the left with a bar listing the stacked windows
# on the right (requires kitty >= 0.50.0)
watcher dock_window.py
watcher stack_bar.py

# Save renamed tabs to the session restored by startup_session in kitty.conf
watcher tab_sessions.py
