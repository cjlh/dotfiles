# Python modules that kitty loads for every window and calls on window events.
# Relative paths are resolved against the config directory.
# See: https://sw.kovidgoyal.net/kitty/launch/#watchers

# Dock the current window on the left of a stack (requires kitty >= 0.50.0)
watcher dock_window.py

# Keep the column of reader mode centred when windows are resized or opened
watcher reader_mode.py

# Save the session whenever kitty quits, not only when logging out, for
# restore_session_after_logout in kitty.conf (requires kitty >= 0.50.0)
watcher save_session_on_quit.py

# Count a program's status as seen when it is reported in the window being
# looked at, for the tab colours of tab_bar.py (requires kitty >= 0.50.0)
watcher program_status_seen.py
