# Custom tab bar styling
# See: https://github.com/kovidgoyal/kitty/discussions/4447#discussioncomment-3912065

tab_bar_margin_width      5
tab_bar_margin_height     8 0

# Custom style enables tab_bar.py
tab_bar_style             custom
tab_bar_min_tabs          1
tab_separator             ""

# The colour of each tab, which tab_bar.py replaces while a window in the tab
# waits on the user, see _attention_color there. The template draws the tab's
# rounded ends in its foreground colour, so that is set to the same colour as
# its background, and the title is drawn in white.
active_tab_foreground     #656565
active_tab_background     #656565
inactive_tab_foreground   #444444
inactive_tab_background   #444444

# The tab's colour already shows that a window in it rang the bell
bell_on_tab               none

# Titles are shortened in tab_bar.py unless the tab was renamed with set_tab_title,
# in which case they show the full name prefixed with an icon
tab_title_template        "{fmt.fg.tab}{fmt.bg.default}{fmt.fg._ffffff}{fmt.bg.tab}{title}{fmt.fg.tab}{fmt.bg.default} "
