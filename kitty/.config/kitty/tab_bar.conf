# Custom tab bar styling
# See: https://github.com/kovidgoyal/kitty/discussions/4447#discussioncomment-3912065

tab_bar_margin_width      5
tab_bar_margin_height     8 0

# Custom style enables tab_bar.py
tab_bar_style             custom
tab_bar_min_tabs          1
tab_separator             ""

# Titles are shortened in tab_bar.py unless the tab was renamed with set_tab_title,
# in which case they show the full name prefixed with an icon
tab_title_template        "{fmt.fg._444446}{fmt.bg.default}{fmt.fg._ffffff}{fmt.bg._444444}{title}{fmt.fg._444444}{fmt.bg.default} "
active_tab_title_template "{fmt.fg._656565}{fmt.bg.default}{fmt.fg._ffffff}{fmt.bg._656565}{title}{fmt.fg._656565}{fmt.bg.default} "
